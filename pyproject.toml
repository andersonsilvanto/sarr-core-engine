[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sarr-core-engine"
version = "0.1.0"
description = "Motor local de auditoria defensiva e telemetria de segurança"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema==4.26.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"schemas" = ["schemas/scope.schema.json", "schemas/dashboard.schema.json"]
"config" = ["config/dashboard.schema.json", "config/canary_credentials.json"]
"docs" = [
    "docs/arquitetura-sarr-core.pdf",
    "docs/arquitetura.txt",
    "docs/plano-implementacao-sarr-core.pdf",
    "docs/visao-do-projeto.txt",
]
"assets" = [
    "assets/Arquitetura_do_SARR-Core_Engine.png",
    "assets/fluxograma-arquitetura.png",
]
